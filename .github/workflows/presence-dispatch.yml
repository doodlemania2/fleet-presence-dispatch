# Shared workflow for the fleet presence standard (requirement 7). An app repo calls it on every push to its trunk.
# It lives in this PUBLIC repo so public app repos (claviger, TDPdf, documenso) can call it; private ones use it too.
#
#
#   on: { push: { branches: [main] } }
#   jobs:
#     presence:
#       uses: doodlemania2/fleet-presence-dispatch/.github/workflows/presence-dispatch.yml@<commit sha>  # main YYYY-MM-DD
#       # Pin to a SHA (main is protected; Dependabot bumps it). presence-diff.mjs is fetched at the same commit.
#       with:
#         property: claviger
#         targets: '["doodlemania2/claviger-site"]'
#         runner: tdp-k3s-claviger
#       secrets:
#         dispatch_token: ${{ secrets.FLEET_DISPATCH_TOKEN }}
#
# It works out which features the push touched (presence/features.json `sources`), then sends `app-changed` to every
# target AT THE SAME TIME (a matrix, max-parallel unlimited). If a feature became `ready`, it also sends
# `feature-shipped` to TDPPublic for the social campaign. Without the token it warns and exits 0, so it never turns a
# push red; each receiver's nightly run is the fallback.
#
# FLEET_DISPATCH_TOKEN: a fine-grained token with Contents write on the target site repos and TDPPublic (the dispatches
# API needs write). Reading the caller repo uses the job's own github.token. In a public repo, call this only on push,
# never on pull_request, so fork PRs never see the secret.
name: presence-dispatch

on:
  workflow_call:
    inputs:
      property:
        type: string
        required: true
      targets:
        description: JSON array of owner/repo that should rebuild on every trunk push
        type: string
        required: true
      runner:
        description: runs-on label (never GitHub-hosted in a private repo)
        type: string
        required: true
      socials_repo:
        type: string
        default: doodlemania2/TDPPublic
      kit_ref:
        description: >-
          fleet-presence-dispatch ref to load presence-diff.mjs from. Leave empty: it then uses the commit THIS workflow
          was called at (job.workflow_sha), so pinning `uses:` to a SHA also pins the script. Never set it to a branch.
        type: string
        default: ''
      send_socials:
        description: >-
          Send feature-shipped to the socials repo. A repo that calls this on two branches (STFoA-Church: staging and
          main) passes `github.ref_name == 'main'` so a feature is announced once, when it is released.
        type: boolean
        default: true
    secrets:
      dispatch_token:
        required: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    outputs:
      payload: ${{ steps.diff.outputs.payload }}
      shipped: ${{ steps.diff.outputs.shipped }}
      has_token: ${{ steps.diff.outputs.has_token }}
    steps:
      - id: diff
        env:
          DISPATCH_TOKEN: ${{ secrets.dispatch_token }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          PROPERTY: ${{ inputs.property }}
          KIT_REF: ${{ inputs.kit_ref || job.workflow_sha }}
        run: |
          set -eu
          if [ -z "${DISPATCH_TOKEN}" ]; then
            echo "::warning::FLEET_DISPATCH_TOKEN is not set; the sites were not told. Their nightly run picks this up."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_token=true" >> "$GITHUB_OUTPUT"
          # Never run presence-diff.mjs from a branch: only a 40-hex commit (job.workflow_sha, or a caller's pinned
          # kit_ref). Otherwise warn and send an empty feature list, so a push never turns red.
          empty='{"has_features_file":false,"features_touched":[],"features_shipped":[],"shipped_details":[]}'
          if ! [[ "${KIT_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning::kit_ref '${KIT_REF}' is not a commit SHA; not running presence-diff.mjs. Pin uses: to a SHA and drop kit_ref."
            diff="${empty}"
          else
            curl -fsS "https://raw.githubusercontent.com/doodlemania2/fleet-presence-dispatch/${KIT_REF}/scripts/presence-diff.mjs" \
              -o "${RUNNER_TEMP}/presence-diff.mjs"
            diff=$(node "${RUNNER_TEMP}/presence-diff.mjs") || { echo "::warning::presence-diff failed; sending an empty feature list"; diff='{"has_features_file":false,"features_touched":[],"features_shipped":[],"shipped_details":[]}'; }
          fi
          echo "presence-diff: ${diff}"
          payload=$(DIFF="${diff}" node -e '
            const d = JSON.parse(process.env.DIFF);
            const e = process.env;
            process.stdout.write(JSON.stringify({ property: e.PROPERTY, repo: e.REPO, ref: e.REF_NAME, sha: e.SHA,
              before: e.BEFORE, features_touched: d.features_touched, features_shipped: d.features_shipped,
              shipped_details: d.shipped_details || [] }));')
          echo "payload=${payload}" >> "$GITHUB_OUTPUT"
          shipped=$(DIFF="${diff}" node -e 'process.stdout.write(String(JSON.parse(process.env.DIFF).features_shipped.length))')
          echo "shipped=${shipped}" >> "$GITHUB_OUTPUT"

  sites:
    needs: plan
    if: needs.plan.outputs.has_token == 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    steps:
      - name: Send app-changed
        env:
          TOKEN: ${{ secrets.dispatch_token }}
          TARGET: ${{ matrix.target }}
          PAYLOAD: ${{ needs.plan.outputs.payload }}
        run: |
          body=$(printf '{"event_type":"app-changed","client_payload":%s}' "${PAYLOAD}")
          status=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' --max-time 30 -X POST \
            -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TARGET}/dispatches" -d "${body}") || status=000
          if [ "${status}" != "204" ]; then
            echo "::warning::${TARGET} answered ${status}; its nightly run picks this change up."
            cat /tmp/dispatch.out || true
            exit 0
          fi
          echo "${TARGET} told to rebuild."

  socials:
    needs: plan
    if: inputs.send_socials && needs.plan.outputs.has_token == 'true' && needs.plan.outputs.shipped != '0'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    steps:
      - name: Send feature-shipped
        env:
          TOKEN: ${{ secrets.dispatch_token }}
          TARGET: ${{ inputs.socials_repo }}
          PAYLOAD: ${{ needs.plan.outputs.payload }}
        run: |
          body=$(printf '{"event_type":"feature-shipped","client_payload":%s}' "${PAYLOAD}")
          status=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' --max-time 30 -X POST \
            -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TARGET}/dispatches" -d "${body}") || status=000
          [ "${status}" = "204" ] || { echo "::warning::${TARGET} answered ${status}"; cat /tmp/dispatch.out || true; }
